[project]
name = "forgetme-aegis"
version = "0.1.0"
description = "ForgetMe + Aegis-Z Guard: verifiable shard-level erasure and human-review guard for a small clinic triage model (IBM Z Datathon 2026, Theme 2). Synthetic data only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
# The project is run from the repository root; it is not installed as a library.
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: trains many forests or builds the shadow cache; excluded from `make test`",
    "linux_only: needs fork, /proc or POSIX file semantics; skipped cleanly on native Windows",
]
